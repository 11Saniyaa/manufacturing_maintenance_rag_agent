<section class="page-header">
  <h2>Parameter Diagnosis</h2>
  <p>Enter machine readings to get practical condition, risk level, and next maintenance actions.</p>
</section>

<section class="layout">
  <aside class="left">
    <app-machine-selector (machineSelected)="onMachineSelected($event)"></app-machine-selector>

    <div class="type-card">
      <label for="machineType">Machine Type (if no machine selected)</label>
      <select id="machineType" [(ngModel)]="machineType">
        <option *ngFor="let type of machineTypes" [value]="type">{{ type }}</option>
      </select>
    </div>
  </aside>

  <section class="form-card">
    <div class="grid">
      <label>
        Temperature (deg C)
        <input type="number" [(ngModel)]="temperatureC" />
      </label>

      <label>
        Vibration (mm/s)
        <input type="number" step="0.1" [(ngModel)]="vibrationMmS" />
      </label>

      <label>
        Motor Current (A)
        <input type="number" step="0.1" [(ngModel)]="currentA" />
      </label>

      <label>
        Oil Pressure (bar) (optional)
        <input type="number" step="0.1" [(ngModel)]="oilPressureBar" />
      </label>

      <label>
        RPM
        <input type="number" [(ngModel)]="rpm" />
      </label>

      <label>
        Runtime Since Service (hours)
        <input type="number" [(ngModel)]="runtimeHours" />
      </label>

      <label>
        Noise Level
        <select [(ngModel)]="noiseLevel">
          <option value="normal">Normal</option>
          <option value="unusual">Unusual</option>
        </select>
      </label>

      <label class="checkbox">
        <input type="checkbox" [(ngModel)]="leakObserved" />
        Leak Observed
      </label>
    </div>

    <label class="note">
      Extra Note (optional)
      <textarea rows="3" [(ngModel)]="note" placeholder="Example: vibration increased after belt replacement"></textarea>
    </label>

    <button class="analyze-btn" (click)="analyze()" [disabled]="isLoading">
      {{ isLoading ? 'Analyzing...' : 'Run Parameter Diagnosis' }}
    </button>

    <div *ngIf="errorText" class="error">{{ errorText }}</div>

    <div *ngIf="resultText" class="result">
      <h3>Diagnosis Result</h3>
      <pre>{{ resultText }}</pre>
    </div>
  </section>
</section>
