<div class="chat-container">
  <div class="chat-header">
    <h2>Chat Assistant</h2>
    <p *ngIf="selectedMachineId" class="machine-context">Context: Machine ID {{ selectedMachineId }}</p>
  </div>
  
  <div class="chat-messages" #messagesContainer>
    <div 
      *ngFor="let message of messages" 
      [class.user-message]="message.isUser"
      [class.assistant-message]="!message.isUser"
      class="message"
    >
      <div class="message-content">
        {{ message.text }}
      </div>
      <div class="message-timestamp">
        {{ message.timestamp | date:'short' }}
      </div>
    </div>
    <div *ngIf="isLoading" class="message assistant-message">
      <div class="message-content">
        <span class="typing-indicator">Thinking...</span>
      </div>
    </div>
  </div>
  
  <div class="chat-input-container">
    <textarea
      [(ngModel)]="currentMessage"
      (keydown)="onKeyPress($event)"
      placeholder="Type your question here... (Press Enter to send)"
      class="chat-input"
      [disabled]="isLoading"
      rows="2"
    ></textarea>
    <button 
      (click)="sendMessage()" 
      [disabled]="!currentMessage.trim() || isLoading"
      class="send-button"
    >
      Send
    </button>
  </div>
</div>
