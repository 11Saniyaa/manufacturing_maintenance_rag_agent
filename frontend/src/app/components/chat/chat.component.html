<div class="chat-container">
  <div class="chat-header">
    <div class="header-top">
      <h3>Chat Assistant</h3>
      <div class="audio-controls">
        <button 
          class="audio-toggle"
          [class.active]="isVoiceInputEnabled"
          (click)="toggleVoiceInput()"
          title="Toggle Voice Input"
        >
          <span class="icon">🎤</span>
          <span class="label">Voice</span>
        </button>
        <button 
          class="audio-toggle"
          [class.active]="isTextToSpeechEnabled"
          (click)="toggleTextToSpeech()"
          title="Toggle Text-to-Speech"
        >
          <span class="icon">🔊</span>
          <span class="label">Audio</span>
        </button>
      </div>
    </div>
    <p *ngIf="selectedMachineId" class="machine-context">Context: Machine ID {{ selectedMachineId }}</p>
  </div>
  
  <div class="messages-container" #messagesContainer>
    <div 
      *ngFor="let message of messages" 
      [class.user-message]="message.isUser"
      [class.bot-message]="!message.isUser"
      class="message"
    >
      <div class="message-content">{{ message.text }}</div>
      <div class="message-time">{{ message.timestamp | date:'short' }}</div>
    </div>
    <div *ngIf="isLoading" class="message bot-message">
      <div class="message-content">
        <span class="typing-indicator">Thinking...</span>
      </div>
    </div>
  </div>
  
  <div class="input-container">
    <div class="input-wrapper">
      <textarea
        [(ngModel)]="currentQuery"
        (keypress)="onKeyPress($event)"
        placeholder="Type your question here or use voice input..."
        class="message-input"
        rows="2"
        [disabled]="isLoading"
      ></textarea>
      <button 
        *ngIf="isVoiceInputEnabled"
        class="voice-button"
        [class.recording]="isRecording"
        (click)="startRecording()"
        [title]="isRecording ? 'Stop Recording' : 'Start Voice Input'"
      >
        <span *ngIf="!isRecording">🎤</span>
        <span *ngIf="isRecording" class="pulse">🔴</span>
      </button>
    </div>
    <button 
      (click)="sendMessage()" 
      class="send-button"
      [disabled]="!currentQuery.trim() || isLoading"
    >
      Send
    </button>
  </div>
  <div *ngIf="isRecording" class="recording-indicator">
    <span class="pulse-dot"></span>
    Listening...
  </div>
</div>
