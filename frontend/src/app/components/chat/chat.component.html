<div class="chat-card">
  <div class="chat-header">
    <div class="title">Maintenance Assistant</div>
    <div class="meta">
      <span *ngIf="selectedMachineId; else allMachines">Machine: #{{ selectedMachineId }}</span>
      <ng-template #allMachines>All machines</ng-template>
    </div>

    <div class="lang">
      <label>
        <span class="lang-label">Lang</span>
        <select [(ngModel)]="language" (change)="onLanguageChange()" title="Speech language">
          <option value="en-US">English</option>
          <option value="hi-IN">Hindi</option>
        </select>
      </label>
    </div>
  </div>

  <div class="chat-body">
    <div class="messages">
      <div *ngFor="let msg of messages; trackBy: trackByIndex" class="message" [class.user]="msg.role === 'user'" [class.assistant]="msg.role === 'assistant'">
        <div class="bubble">
          <div class="content" [innerText]="msg.content"></div>
          <div class="time">{{ msg.timestamp | date:'shortTime' }}</div>
        </div>
      </div>
    </div>

    <div *ngIf="lastError" class="error">{{ lastError }}</div>
  </div>

  <div class="chat-footer">
    <textarea
      class="input"
      rows="2"
      placeholder="Ask a maintenance question…"
      [(ngModel)]="queryText"
      (keydown)="onKeyDown($event)"
      [disabled]="isSending"
    ></textarea>
    <div class="actions">
      <label *ngIf="showPhotoControls" class="upload">
        <input type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" (change)="onImageSelected($event)" [disabled]="isSending" />
        <span>Photo</span>
      </label>

      <button
        *ngIf="showPhotoControls && selectedImageDataUrl"
        class="icon stop"
        type="button"
        title="Remove selected image"
        (click)="clearSelectedImage()"
        [disabled]="isSending"
      >
        Clear Photo
      </button>

      <button
        *ngIf="showPhotoControls"
        class="send photo-send"
        type="button"
        (click)="analyzeImage()"
        [disabled]="isSending || !selectedImageDataUrl"
        title="Analyze selected machine photo"
      >
        {{ isSending ? 'Analyzing…' : 'Analyze Photo' }}
      </button>

      <button
        *ngIf="showVoiceControls"
        class="icon"
        type="button"
        title="Speak your question"
        (click)="toggleListening()"
        [disabled]="isSending || !canUseSpeechToText"
        [class.active]="isListening"
      >
        {{ isListening ? '■' : '🎤' }}
      </button>

      <button
        *ngIf="showVoiceControls && isListening"
        class="icon stop"
        type="button"
        title="Stop microphone"
        (click)="stopListening()"
      >
        Stop
      </button>

      <button
        *ngIf="showVoiceControls"
        class="icon"
        type="button"
        title="Read the last answer aloud"
        (click)="speakLastAssistantMessage()"
        [disabled]="!canUseTextToSpeech"
      >
        🔊
      </button>

      <button
        *ngIf="showVoiceControls && isSpeaking"
        class="icon stop"
        type="button"
        title="Stop voice"
        (click)="stopSpeaking()"
      >
        Stop
      </button>

      <label *ngIf="showVoiceControls" class="toggle" [class.disabled]="!canUseTextToSpeech" title="Automatically read assistant replies aloud">
        <input type="checkbox" [(ngModel)]="autoSpeakReplies" [disabled]="!canUseTextToSpeech" />
        <span>Auto</span>
      </label>

      <label class="toggle" title="Make answers concise and well-structured">
        <input type="checkbox" [(ngModel)]="conciseMode" />
        <span>Concise</span>
      </label>

      <button class="send" type="button" (click)="send()" [disabled]="isSending || !queryText.trim()">
        {{ isSending ? 'Sending…' : 'Send' }}
      </button>
    </div>
  </div>

  <div *ngIf="selectedImageDataUrl" class="image-preview-wrap">
    <img [src]="selectedImageDataUrl" alt="Selected machine photo preview" class="image-preview" />
    <div class="image-preview-label">{{ selectedImageName || 'Photo selected' }}</div>
  </div>

  <div *ngIf="sttStatus" class="stt-status">{{ sttStatus }}</div>
  <div *ngIf="isSpeaking" class="tts-status">Speaking…</div>
</div>
