<div class="machine-selector">
  <label for="machine-select">Select Machine (Optional):</label>
  <div class="selector-container">
    <select 
      id="machine-select" 
      [(ngModel)]="selectedMachineId" 
      (change)="onMachineChange()"
      class="machine-select"
      [disabled]="isLoading"
    >
      <option [value]="undefined">All Machines</option>
      <option *ngFor="let machine of machines" [value]="machine.id">
        {{ machine.name }} ({{ machine.type }})
      </option>
    </select>
    <button 
      *ngIf="selectedMachineId" 
      (click)="clearSelection()" 
      class="clear-button"
      title="Clear selection"
    >
      ×
    </button>
  </div>
  <div *ngIf="isLoading" class="loading">Loading machines...</div>
</div>
