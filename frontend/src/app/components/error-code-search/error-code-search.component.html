<div class="error-code-search">
  <h3>Error Code Search</h3>
  <div class="search-container">
    <input 
      type="text" 
      [(ngModel)]="searchKeyword" 
      (keypress)="onKeyPress($event)"
      placeholder="Search error codes..."
      class="search-input"
    />
    <button (click)="search()" class="search-button" [disabled]="!searchKeyword.trim() || isLoading">
      Search
    </button>
    <button *ngIf="hasSearched" (click)="clearSearch()" class="clear-button">
      Clear
    </button>
  </div>

  <div *ngIf="isLoading" class="loading">Searching...</div>

  <div *ngIf="!isLoading && hasSearched && errorCodes.length === 0" class="no-results">
    No error codes found for "{{ searchKeyword }}"
  </div>

  <div *ngIf="!isLoading && errorCodes.length > 0" class="results">
    <div *ngFor="let code of errorCodes" class="error-code-card">
      <div class="code-header">
        <span class="code-value">{{ code.code }}</span>
        <span class="code-meaning">{{ code.meaning }}</span>
      </div>
      <div class="code-description">{{ code.description }}</div>
      <div class="code-troubleshooting">
        <strong>Troubleshooting:</strong>
        <div>{{ code.troubleshootingSteps }}</div>
      </div>
    </div>
  </div>
</div>
