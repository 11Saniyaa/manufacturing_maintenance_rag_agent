<div class="app-container">
  <header>
    <h1>{{ title }}</h1>
    <p class="subtitle">AI-powered maintenance assistant for manufacturing equipment</p>
  </header>
  
  <main>
    <div class="content-grid">
      <div class="left-panel">
        <app-machine-selector (machineSelected)="onMachineSelected($event)"></app-machine-selector>
        <app-error-code-search></app-error-code-search>
      </div>
      
      <div class="right-panel">
        <app-chat [selectedMachineId]="selectedMachineId"></app-chat>
      </div>
    </div>
  </main>
</div>
